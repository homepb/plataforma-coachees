<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0E10">
<title>Programa de Alta Performance</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/icone.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<div id="raiz"></div>
<dialog id="modal"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/config.js"></script>
<script>
  // O SDK do Firebase só é carregado quando há credenciais; sem elas a plataforma roda em modo demonstração.
  if (window.FIREBASE_CONFIG) {
    ['app', 'auth', 'firestore'].forEach(m => document.write(`<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-${m}-compat.js"><\/script>`));
  }
</script>
<script src="js/conteudo.js"></script>
<script src="js/regras.js"></script>
<script src="js/semente-demo.js"></script>
<script src="js/dados.js"></script>
<script src="js/app.js"></script>
<script src="js/coachee.js"></script>
<script src="js/coach.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
